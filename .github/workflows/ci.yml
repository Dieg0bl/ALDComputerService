name: CI/CD Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      
    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        
    - name: Cache dependencies
      uses: actions/cache@v3
      with:
        path: |
          ~/.ant/lib
          lib/
        key: ${{ runner.os }}-ant-${{ hashFiles('**/build.xml') }}
        restore-keys: |
          ${{ runner.os }}-ant-
          
    - name: Build project
      run: ant clean jar
      
    - name: Upload build artifacts
      uses: actions/upload-artifact@v3
      with:
        name: ald-computer-service-jar
        path: dist/*.jar
        retention-days: 30
        
  documentation:
    runs-on: ubuntu-latest
    needs: build
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      
    - name: Validate documentation
      run: |
        echo "Checking README.md exists..."
        test -f README.md
        echo "Checking documentation in docs/ directory..."
        test -d docs
        echo "Documentation validation passed"
        
    - name: Archive documentation
      uses: actions/upload-artifact@v3
      with:
        name: documentation
        path: |
          README.md
          docs/
        retention-days: 90